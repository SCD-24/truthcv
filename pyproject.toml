[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.importlinter]
root_packages = [
    "launcher",
    "truthcv",
]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
# Top to bottom. '|' = independent siblings, ':' = non-independent siblings.
layers = [
    "truthcv.adapters.http | truthcv.adapters.mcp | launcher",
    "truthcv.services",
    "truthcv.engines.tailor : truthcv.engines.coverletter : truthcv.engines.guardrail : truthcv.engines.render : truthcv.engines.prompts : truthcv.engines.vocabulary",
    "truthcv.domain.truth : truthcv.domain.screening : truthcv.domain.applications : truthcv.domain.companyresearch : truthcv.domain.runs : truthcv.domain.agentconfig : truthcv.domain.companyboards : truthcv.domain.onboarding : truthcv.domain.gmailsync : truthcv.domain.jobfeeds",
    "truthcv.integrations.providers : truthcv.integrations.connections : truthcv.integrations.modelrouting",
    "truthcv.infra.storage : truthcv.infra.secretstore : truthcv.infra.jobs : truthcv.infra.identity : truthcv.infra.mcpschema",
]
# A stale ignore entry fails the check, so this list can only shrink.
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    # Permanent: truthcv/adapters/http/main.py is the composition root that
    # mounts the MCP server; a named exception.
    "truthcv.adapters.http.main -> truthcv.adapters.mcp.server",
]
