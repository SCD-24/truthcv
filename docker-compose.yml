services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - AGENT_API_TOKEN=${AGENT_API_TOKEN:-}
      # In-container path the app writes to — must equal the volume mount target
      # below. Do NOT derive this from the host's .env DATA_DIR (that's a host path).
      - DATA_DIR=/app/data
    volumes:
      # Host storage location (DATA_DIR from .env) mounted at the fixed
      # in-container /app/data. Set DATA_DIR in .env to relocate host data.
      - ${DATA_DIR:-./data}:/app/data

  # Optional local model runtime: `docker compose --profile ollama up`
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # Containerised headful Chromium MCP server, reached by the agent over HTTP.
  # Started on a bare `docker compose up` (no profiles) so the agent can drive
  # it immediately without manual setup. The browser runs headful under Xvfb
  # with a noVNC viewport at http://localhost:7900 for observation or manual
  # one-time login (CAPTCHA, SMS MFA, etc.). The persistent /browser-profile
  # named volume preserves sessions across restarts.
  browser:
    build:
      context: .
      dockerfile: browser/Dockerfile
    restart: unless-stopped
    ports:
      # noVNC web viewer (public; use this to watch or debug a run)
      - "7900:7900"
    volumes:
      # Persistent Chromium profile (survives container restarts)
      - browser-profile:/browser-profile
      # Read-only app data volume — so Playwright's browser_file_upload can
      # resolve paths get_canonical_cv returns (e.g. /app/data/canonical_cv.pdf).
      # The app service sets DATA_DIR=/app/data, so the paths line up.
      - ${DATA_DIR:-./data}:/app/data:ro
    environment:
      - BROWSER_MCP_PORT=8931
      - BROWSER_PROFILE_DIR=/browser-profile
      - TZ=${TZ:-UTC}
    healthcheck:
      # Probe the MCP HTTP port with a simple GET. The base image ships node,
      # so this is a cheap, safe check.
      #
      # ANY HTTP response counts as healthy and the status code is deliberately
      # NOT interpreted. MCP's streamable-HTTP transport answers a bare GET -
      # no session id, no `Accept: text/event-stream` - with a 4xx by design
      # (400/405/406 depending on version), so a healthy @playwright/mcp never
      # returns 200 here. Asserting 200 would leave this container permanently
      # unhealthy and hang the `agent` service's service_healthy gate below,
      # forever, against a browser that is working perfectly. Only a connection
      # error or a timeout means the server is not listening. agent/smoke-test.sh
      # and agent/daily-apply.sh's probe_browser() use the same rule; keep all
      # three in step.
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:8931/mcp',{timeout:5000},()=>process.exit(0));r.on('timeout',()=>{r.destroy();process.exit(1)});r.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Unattended job-application agent — its own container, deliberately
  # separate from `app` and `browser`, so a browser crash can never take the
  # wizard or agent down. Runs Claude Code on a schedule against
  # agent/RUNBOOK.md and agent/prompt.md, reaching tools via agent/mcp.json.
  # Now started on a bare `docker compose up` (no profiles) and drives the
  # containerised browser over HTTP.
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    depends_on:
      app:
        # `app` serves the TruthCV MCP tools; it has no healthcheck of its own,
        # so this is start-ordering only. daily-apply.sh's TRUTHCV_MCP_URL
        # precondition is what actually catches an app that is up but not ready.
        condition: service_started
      browser:
        # Wait for the browser to actually be serving MCP, not merely started:
        # the agent aborts a run outright when it cannot reach the browser, and
        # on a cold `docker compose up` Chromium needs longer to come up than
        # the agent does. See the browser healthcheck above - it passes on any
        # HTTP response, so this gate cannot hang on a working browser.
        condition: service_healthy
    # Scheduled long-running loop (the run loop itself is task t-4's
    # entrypoint), same as `app` — it should come back after a host reboot or
    # a crash rather than stay down silently.
    restart: unless-stopped
    environment:
      # HH:MM,HH:MM (24h, container TZ) — fallback run times, used only when
      # the app's agent config API (Agents page) is unreachable. The Agents
      # page is the schedule's source of truth; see agent/entrypoint.sh's
      # refresh_schedule().
      - RUN_AT=${RUN_AT:-09:00,15:00}
      # In-network address of the `app` service's MCP streamable-HTTP JSON-RPC
      # tool surface (POST /mcp, agenttools/mcp_app.py) — only reachable inside
      # the compose network, not from the host. The same service also serves the
      # REST tool routes GET /mcp/tools and POST /mcp/tools/{name}
      # (agenttools/server.py).
      - TRUTHCV_MCP_URL=${TRUTHCV_MCP_URL:-http://app:8080/mcp}
      # In-network address of the `browser` service's MCP surface
      # (@playwright/mcp, browser/Dockerfile) — the agent's only way to apply.
      # agent/mcp.json expands the same variable with the same default, and
      # agent/daily-apply.sh probes it as a precondition, so all three stay in
      # step. Only reachable inside the compose network, not from the host.
      - BROWSER_MCP_URL=${BROWSER_MCP_URL:-http://browser:8931/mcp}
      # No default: the architecture has no daily quota (agent/RUNBOOK.md
      # §1, "There is no daily quota"). Empty/unset must be treated by the
      # run loop (task t-4) as "no cap", not as zero.
      - MAX_APPLICATIONS_PER_RUN=${MAX_APPLICATIONS_PER_RUN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AGENT_API_TOKEN=${AGENT_API_TOKEN:-}
      # Which weekdays the run loop fires on (1=Mon..7=Sun), read by
      # agent/entrypoint.sh. Job applications are a weekday activity by
      # default; the Agents page can override the schedule at runtime.
      - RUN_DAYS=${RUN_DAYS:-1,2,3,4,5}
      # Where agent/daily-apply.sh writes per-run logs. Must stay inside the
      # agent-runs volume mounted below, or the logs vanish on restart.
      - RUN_LOG_DIR=${RUN_LOG_DIR:-/app/runs}
      # RUN_AT and RUN_DAYS above are container-local times, so the container
      # needs the operator's timezone or an unattended run fires at the wrong
      # hour. Same default as the `browser` service.
      - TZ=${TZ:-UTC}
      # Which of agent/mcp.json's two browser drivers the agent may use:
      #   browser     (default) the containerised @playwright/mcp service above
      #   interceptor           the operator's HOST Chrome via the Interceptor
      #                         daemon — requires docker-compose.interceptor.yml
      # agent/daily-apply.sh grants ONLY the selected driver's tools to `claude`,
      # and runs that driver's preconditions and no others. Keep the default at
      # `browser`: it is self-contained, so a checkout with no Interceptor on the
      # host still applies successfully out of the box.
      - AGENT_BROWSER_DRIVER=${AGENT_BROWSER_DRIVER:-browser}
      # --- Interceptor driver settings (inert unless AGENT_BROWSER_DRIVER=interceptor) ---
      # Path INSIDE the container of the host Interceptor binary. Nothing mounts
      # it here on purpose: see docker-compose.interceptor.yml, which adds the
      # bind mount. A bind mount of a host path that does not exist makes Docker
      # create a DIRECTORY at the target and the container then fails obscurely,
      # so mounting it unconditionally would break `docker compose up` for every
      # operator who does not run Interceptor.
      - INTERCEPTOR_BIN=${INTERCEPTOR_BIN:-/opt/interceptor/bin/interceptor}
      # The CLI-to-daemon IPC socket, same path inside and out (see the overlay).
      - INTERCEPTOR_SOCKET_PATH=${INTERCEPTOR_SOCKET:-/tmp/interceptor.sock}
      # Interceptor MCP safety tiers: read + mutate are allowed by default;
      # destructive and arbitrary-exec are refused unless opted into here. Leave
      # it EMPTY for an unattended submitter — filling and submitting an ATS form
      # classifies as `mutate`, which is already allowed.
      - INTERCEPTOR_MCP_ALLOW=${INTERCEPTOR_MCP_ALLOW:-}
      # Prompt-injection protection while reading job postings. Keep it on.
      - INTERCEPTOR_MCP_FENCE=${INTERCEPTOR_MCP_FENCE:-on}
      # MCP group scope, for the daemon's own audit trail.
      - INTERCEPTOR_MCP_GROUP=${INTERCEPTOR_MCP_GROUP:-truthcv-agent}
    volumes:
      # Per-run logs written by agent/daily-apply.sh (RUN_LOG_DIR, default
      # /app/runs). Its own named volume, NOT the app's data volume: these are
      # operator diagnostics for unattended runs, and without a volume they
      # vanish on every container restart, which is exactly when they are
      # wanted. Nothing else in the system reads them.
      - agent-runs:/app/runs
      # Deliberately NOT mounting the app's data volume here: every
      # capability the agent has goes through the TruthCV MCP tool surface
      # (agenttools/mcp_app.py POST /mcp JSON-RPC, or agenttools/server.py REST
      # routes), not the filesystem — agent/RUNBOOK.md says outright "There is no
      # file on disk to read any of this from — call the tool." Keep this surface
      # small; do not add ${DATA_DIR:-./data}:/app/data without a concrete, checked need.

volumes:
  ollama:
  agent-runs:
  browser-profile:
