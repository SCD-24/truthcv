name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # tests/test_daily_apply_session_probe.py runs the real node snippet out
      # of agent/daily-apply.sh. The runner already ships a node, so this is
      # not about availability: it pins the same major the agent container
      # runs (agent/Dockerfile: FROM node:22-bookworm-slim) so the snippet is
      # exercised under the version production uses. Do not drop this step.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build

  # agent/smoke-test.sh is the only gate that can catch the class of defect
  # `node --check` structurally cannot see — an ESM `require()` inside an
  # unexercised branch, a scheduler that ignores the enabled toggle — because
  # it RUNS the agent's wiring instead of parsing it. It only means anything
  # against the real images, so this job builds them and runs the script inside
  # the agent container exactly as agent/README.md documents.
  agent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Compose interpolates these; without them every `${VAR:-}` reference
      # logs a warning and AGENT_API_TOKEN would reach the container empty.
      # A throwaway value is correct here: nothing in this job authenticates
      # against anything real, and the smoke test mints its own token for the
      # supervisor instance it starts.
      AGENT_API_TOKEN: ci-smoke-token
      DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4
      # data/ is gitignored, so the checkout has no such directory and compose
      # would create it root-owned. Make it first so the bind mount lines up.
      - name: Create the data volume directory
        run: mkdir -p data
      - name: Build images
        run: docker compose build app browser agent
      # `docker compose run` honours depends_on, so this starts `app` and waits
      # on the `browser` healthcheck before the script runs — the same gate the
      # real agent service goes through. The script's TRUTHCV_MCP_URL and
      # BROWSER_MCP_URL probes need both of them actually serving.
      - name: Run agent smoke test
        run: docker compose run --rm --entrypoint /app/agent/smoke-test.sh agent
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
