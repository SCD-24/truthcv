name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # tests/test_daily_apply_session_probe.py runs the real node snippet out
      # of agent/daily-apply.sh. The runner already ships a node, so this is
      # not about availability: it pins the same major the agent container
      # runs (agent/Dockerfile: FROM node:22-bookworm-slim) so the snippet is
      # exercised under the version production uses. Do not drop this step.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
